# SPDX-License-Identifier: MIT
# Weekly version updates, grouped to keep PR volume low for a two-person team. Security updates are separate
# (enable "Dependabot security updates" in the repository settings).
version: 2
updates:
  - package-ecosystem: uv
    directory: /packages/engine-py
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: uv
    directory: /packages/server
    schedule: { interval: weekly }
    groups:
      server: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    ignore:
      # typescript-eslint 8.x supports TypeScript < 6.1; lift when it supports newer TypeScript.
      - dependency-name: typescript
        versions: [">=6.1"]
      # @types/node follows the oldest supported Node (engines: >=22.12), not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
