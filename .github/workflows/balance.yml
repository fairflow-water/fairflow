# SPDX-License-Identifier: MIT
#
# Balance baseline (blueprint §9.2 baseline tier; handoff §8 item 2): on every merge to main, whole games through the
# engine with the strategy agents, failing on any §9.2 criterion. It measures; nothing here may be tuned to pass
# (handoff §2 rule 6). 50 games per cell is the documented baseline (a few minutes on a runner).
name: balance
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: balance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  balance:
    name: Balance baseline (§9.2), 50 games per cell
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/engine-py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Run the harness and fail on any criterion
        run: uv run python analysis/balance.py 50 --check | tee balance-report.json
        shell: bash -o pipefail {0}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: balance-report
          path: packages/engine-py/balance-report.json
