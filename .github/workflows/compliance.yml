# SPDX-License-Identifier: MIT
name: licence-and-citation
on: [push, pull_request]
jobs:
  reuse:
    name: REUSE compliance (every file carries an SPDX identifier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v4
  citation:
    name: CITATION.cff validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"
  engine:
    name: Engine builds and fixtures pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: cd packages/engine && npm install && npx tsc -p tsconfig.json && npx vitest run
      - name: engine serve answers over NDJSON
        run: cd packages/engine && echo '{"id":1,"cmd":"version"}' | node dist/cli.js serve | grep -q '"ok":true'
      - name: β fixtures are up to date with the engine
        run: cd packages/engine && npm run fixtures:beta && git diff --exit-code fixtures/default-basin-beta.json
  python-engine:
    name: Python engine reproduces the blueprint (authoritative)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: cd packages/engine-py && pip install -e ".[test]" && python -m pytest -q
  tag-reminder:
    name: Release checklist (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          grep -q "^version: ${GITHUB_REF_NAME#v}$" CITATION.cff || { echo "CITATION.cff version must equal the tag"; exit 1; }
          test -f LICENSE && test -f LICENSE-docs && test -f docs/blueprint.md
