# SPDX-License-Identifier: MIT
name: dco
on: [pull_request]
permissions:
  contents: read
jobs:
  dco:
    name: Developer Certificate of Origin sign-off
    # Dependabot's commits are machine-generated version bumps, not contributions under the DCO.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Every non-merge commit carries Signed-off-by
        env:
          BASE_REF: ${{ github.base_ref }} # passed as data, never interpolated into the script
        run: |
          for c in $(git rev-list --no-merges "origin/${BASE_REF}..HEAD"); do
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: ' || { echo "commit $c lacks Signed-off-by (git commit -s)"; exit 1; }
          done
